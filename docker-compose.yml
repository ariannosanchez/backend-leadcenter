
version: '3'

services:
  db:
    image: mongo:5
    container_name: mongo_leadcenter
    restart: always
    environment:
      MONGO_INITDB_DATABASE: leadcenter
    ports:
      - "27017:27017"  # 🔹 Exponemos para conectar desde Compass o Robo 3T
    volumes:
      - ./mongo:/data/db

